/* =========================================================
   Wine with Kai · shared styles
   Curated wine dinners, Singapore
   ========================================================= */

:root {
  --bg:        #160a0c;
  --bg-2:      #1d1013;
  --panel:     #201215;
  --ink:       #ece3d6;
  --ink-soft:  #bdae9f;
  --ink-faint: #8c7d71;
  --gold:      #c9a24b;
  --gold-soft: #d8bd7e;
  /* red removed from the palette; these now carry the gold accent */
  --crimson:   #c9a24b;
  --crimson-2: #c9a24b;
  --line:      rgba(236, 227, 214, 0.11);
  --line-soft: rgba(236, 227, 214, 0.06);

  --serif:   'EB Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif;

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.72;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--gold); color: #201013; }

a { color: inherit; }

/* Visible keyboard focus, on-brand for the dark theme.
   Uses :focus-visible so it shows for keyboard/switch users
   without ringing on mouse clicks. */
a:focus-visible,
.btn:focus-visible,
.next-card:focus-visible,
.home-link:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
  border-radius: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.001ms !important;
    animation-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

img { max-width: 100%; display: block; }

.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 28px;
}

/* ---------- Eyebrow / small-caps kicker ---------- */
.eyebrow {
  font-family: var(--serif);
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.34em;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  margin: 0;
}

/* ---------- Thin rules ---------- */
.rule-crimson {
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold) 14%, var(--gold) 86%, transparent);
  border: 0;
  opacity: 0.72;
  max-width: var(--maxw);
  margin: 0 auto;
  width: calc(100% - 56px);
}
.tick {
  width: 44px;
  height: 1px;
  background: var(--gold);
  border: 0;
  opacity: 0.85;
  margin: 0 0 20px;
}

/* =========================================================
   HERO (landing)
   ========================================================= */
.hero-scene {
  position: relative;
  height: 40vh;
  min-height: 300px;
  max-height: 440px;
  overflow: hidden;
  background: #0d0708;
}
.hero-scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-scene::after {
  /* fade the bottom of the scene into the page */
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 46%;
  background: linear-gradient(to bottom, rgba(22,10,12,0) 0%, var(--bg) 96%);
}

.hero-body { padding: 46px 0 8px; }

.masthead {
  text-align: center;
  padding-top: 30px;
}
.masthead .kick { margin-bottom: 26px; }

.title-display {
  font-family: var(--display);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.02;
  letter-spacing: 0.01em;
  margin: 0;
  font-size: clamp(46px, 9vw, 74px);
}
.title-connector {
  display: block;
  font-family: var(--display);
  font-style: italic;
  font-weight: 500;
  color: var(--gold);
  font-size: clamp(22px, 3.4vw, 30px);
  line-height: 1.2;
  margin: 2px 0;
  letter-spacing: 0.01em;
}

.gold-divider {
  width: min(560px, 82%);
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold) 18%, var(--gold) 82%, transparent);
  border: 0;
  margin: 30px auto 26px;
  opacity: 0.85;
}

.lede {
  text-align: center;
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(21px, 3.1vw, 27px);
  color: var(--ink);
  margin: 0 auto 8px;
  max-width: 640px;
  line-height: 1.35;
}
.lede-sub {
  text-align: center;
  font-style: italic;
  color: var(--ink-faint);
  font-size: 18px;
  line-height: 1.5;
  margin: 0 auto 4px;
  max-width: 560px;
}

/* =========================================================
   WINE LINEUP (landing list)
   ========================================================= */
.lineup { margin: 6px 0 4px; }

.flight {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 6px 22px;
  align-items: baseline;
  padding: 22px 4px;
  border-top: 1px solid var(--line-soft);
}
.flight:last-child { border-bottom: 1px solid var(--line-soft); }

.flight-yr {
  font-family: var(--display);
  color: var(--crimson);
  font-size: 32px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: 0.01em;
}
.flight-main { }
.flight-name {
  font-family: var(--display);
  font-size: 24px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.18;
  margin: 0 0 4px;
}
.flight-sub {
  color: var(--ink-faint);
  font-size: 16.5px;
  font-style: italic;
  line-height: 1.4;
  margin: 0;
}
.flight-order {
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  align-self: center;
}

/* ---------- CTA ---------- */
.cta-row { text-align: center; margin: 40px 0 8px; }
.btn {
  display: inline-block;
  font-family: var(--serif);
  font-size: 16px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
  text-decoration: none;
  padding: 15px 34px;
  border: 1px solid var(--gold);
  border-radius: 2px;
  transition: background .25s ease, color .25s ease;
}
.btn:hover { background: var(--gold); color: #201013; }
.btn .arw { color: var(--gold); margin-left: 8px; transition: color .25s ease; }
.btn:hover .arw { color: #201013; }

.note-line {
  text-align: center;
  font-style: italic;
  color: var(--ink-faint);
  font-size: 16px;
  line-height: 1.55;
  max-width: 620px;
  margin: 26px auto 0;
}

/* =========================================================
   EVENT FOOTER BAR
   ========================================================= */
.event-bar {
  background: var(--bg-2);
  border-top: 1px solid rgba(201, 162, 75, 0.5);
  border-bottom: 1px solid rgba(201, 162, 75, 0.5);
  color: var(--ink);
  text-align: center;
  padding: 30px 24px;
  margin-top: 54px;
}
.event-bar .when {
  font-family: var(--display);
  font-weight: 500;
  color: var(--gold-soft);
  font-size: clamp(21px, 3.4vw, 27px);
  margin: 0 0 6px;
  letter-spacing: 0.02em;
}
.event-bar .where {
  font-family: var(--serif);
  font-size: 18px;
  color: var(--ink-soft);
  margin: 0;
  letter-spacing: 0.02em;
}

.page-foot {
  text-align: center;
  color: var(--ink-faint);
  font-size: 14px;
  font-style: italic;
  padding: 26px 20px 40px;
}

/* =========================================================
   WINES PAGE
   ========================================================= */
.page-head { text-align: center; padding: 40px 0 6px; }
.page-head .eyebrow { margin-bottom: 20px; }
.page-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(40px, 7vw, 60px);
  line-height: 1.05;
  margin: 0;
}
.page-title .it {
  display: block;
  font-style: italic;
  font-weight: 500;
  color: var(--gold);
  font-size: clamp(19px, 3vw, 26px);
  margin-top: 4px;
}

.section { padding: 20px 0; }
.section h2 {
  font-family: var(--display);
  color: var(--gold);
  font-weight: 600;
  font-size: 27px;
  margin: 30px 0 14px;
  letter-spacing: 0.01em;
}
.section p { margin: 0 0 18px; color: var(--ink); }
.section p.muted { color: var(--ink-soft); }
em, .i { font-style: italic; }
strong, .b { font-weight: 600; color: var(--ink); }

/* ---------- Wine entries ---------- */
.wines { margin-top: 8px; }

.wine {
  border-top: 1px solid var(--line);
  padding: 34px 0 30px;

}
.cam-frame i { position: absolute; width: 28px; height: 28px; border: 3px solid var(--gold); }
.cam-frame i:nth-child(1) { top: -3px; left: -3px; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
.cam-frame i:nth-child(2) { top: -3px; right: -3px; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
.cam-frame i:nth-child(3) { bottom: -3px; left: -3px; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }

.cam-hint {

@keyframes cam-flash { from { opacity: 0.85; } to { opacity: 0; } }
.cam-off { background: rgba(0, 0, 0, 0.7); padding: 16px; }

<script>
// Wine with Kai · shared helpers for the reservation, BYOB and admin pages.
// Needs supabase-js (UMD build) and wwk-config.js loaded first.
(function () {
  const cfg = window.WWK_CONFIG || {};
  const ready = !!(cfg.supabaseUrl && cfg.supabaseAnonKey && window.supabase);
  const client = ready
    ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
        // implicit flow: the emailed link works even if opened in another browser
        auth: { flowType: "implicit", persistSession: true, detectSessionInUrl: true },
      })
    : null;

  const TZ = "Asia/Singapore";

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function money(cents, currency) {
    if (cents == null) return "";
    const sym = (currency || "sgd").toLowerCase() === "sgd" ? "S$" : (currency || "").toUpperCase() + " ";
    const neg = cents < 0;
    const abs = Math.abs(cents);
    const whole = abs % 100 === 0;
    const n = (abs / 100).toLocaleString("en-SG", {
      minimumFractionDigits: whole ? 0 : 2,
      maximumFractionDigits: 2,
    });
    return (neg ? "-" : "") + sym + n;
  }

  function parts(iso, opts) {
    const out = {};
    new Intl.DateTimeFormat("en-GB", Object.assign({ timeZone: TZ }, opts))
      .formatToParts(new Date(iso)).forEach((p) => { out[p.type] = p.value; });
    return out;
  }

  // "Thursday 8 October 2026 · 7:00 pm"
  function when(iso) {
    const d = parts(iso, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    return `${d.weekday} ${d.day} ${d.month} ${d.year} · ${time(iso)}`;
  }
  // "8 October 2026"
  function day(iso) {
    const d = parts(iso, { day: "numeric", month: "long", year: "numeric" });
    return `${d.day} ${d.month} ${d.year}`;
  }
  function time(iso) {
    const t = parts(iso, { hour: "numeric", minute: "2-digit", hour12: true });
    return `${t.hour}:${t.minute} ${(t.dayPeriod || "").toLowerCase()}`;
  }

  function param(name) {
    return new URLSearchParams(location.search).get(name);
  }

  // the last moment a cancellation still gets the deposit back
  function refundCutoff(ev) {
    return new Date(new Date(ev.starts_at).getTime() - ev.refund_days * 86400000);
  }

  const ERRORS = {
    not_signed_in: "Please sign in first.",
    no_profile: "Please add your name first.",
    event_not_found: "This evening could not be found.",
    event_not_open: "Reservations for this evening are not open.",
    deposit_not_set: "The deposit has not been set yet, so seats cannot be reserved just yet.",
    event_started: "This evening has already begun.",
    not_invited: "This evening is by invitation. Sign in with the email address your invitation was sent to.",
    not_a_guest: "The tally is shared with seated guests only.",
    checkout_failed: "The payment page could not be opened. Please try again in a moment.",
    refund_failed: "The refund could not be issued automatically. Kai has been told; nothing has been cancelled yet.",
    no_reservation: "There is no reservation to cancel.",
    too_many_lookups: "You have used today's bottle look-ups. Please type the details and Kai will check the price.",
    assist_refused: "The assistant could not help with this one.",
    assist_failed: "The assistant could not finish this time.",
    assist_busy: "The assistant is busy just now. Please try again in a minute.",
    nothing_to_look_up: "Add the producer or the wine first.",
    bad_photo: "That photo could not be used. Please try another.",
  };
  function errorText(e) {
    const code = (e && (e.code || e.message)) || String(e);
    for (const k in ERRORS) if (code.indexOf(k) !== -1) return ERRORS[k];
    return "Something went wrong: " + code;
  }

  // call an edge function; surfaces the { error } code it returns
  async function callFn(name, body) {
    const { data, error } = await client.functions.invoke(name, { body });
    if (error) {
      let code = error.message;
      try { code = (await error.context.json()).error || code; } catch (_) {}
      throw { code };
    }
    return data;
  }

  async function rpc(fn, args) {
    const { data, error } = await client.rpc(fn, args);
    if (error) throw error;
    return data;
  }

  async function user() {
    if (!client) return null;
    const { data } = await client.auth.getSession();
    return data.session ? data.session.user : null;
  }

  async function profile(u) {
    const { data } = await client.from("profiles").select("*").eq("id", u.id).maybeSingle();
    return data;
  }

  const LAST_EMAIL = "wwk-email";
  const remembered = () => { try { return localStorage.getItem(LAST_EMAIL) || ""; } catch (_) { return ""; } };
  const remember = (v) => { try { localStorage.setItem(LAST_EMAIL, v); } catch (_) {} };

  // Two steps on the same page: email, then the code from the email.
  // The email also carries a link, which signs in just as well.
  function signInForm(el, lead, onSignedIn) {
    const google = !!cfg.googleSignIn;
    el.innerHTML = `
      <p class="kicker">Sign in</p>
      <p>${lead || (google ? "One tap with Google, or we can email you a 6-digit code." : "Enter your email and we will send you a 6-digit code. No password needed.")}</p>
      ${google ? `
      <div class="actions" style="margin:4px 0 14px;">
        <button class="btn small solid google" type="button" data-google>
          <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Continue with Google</button>
      </div>
      <p class="hint-or">or with your email</p>` : ""}
      <form class="form" data-signin>
        <label>Email <input type="email" name="email" required autocomplete="email" value="${esc(remembered())}"></label>
        <div class="actions"><button class="btn small solid" type="submit">Email me a code</button></div>
        <p class="msg" data-msg aria-live="polite"></p>
      </form>
      <form class="form" data-code hidden>
        <label>The code from your email
          <input name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}"
            maxlength="10" placeholder="123456" style="letter-spacing:0.3em; font-size:22px; max-width:220px;"></label>
        <div class="actions">
          <button class="btn small solid" type="submit">Sign in</button>
          <button class="linkish" type="button" data-again>Use another email</button>
        </div>
        <p class="msg" data-msg2 aria-live="polite"></p>
      </form>`;
    const form = el.querySelector("[data-signin]");
    const codeForm = el.querySelector("[data-code]");
    const gBtn = el.querySelector("[data-google]");
    if (gBtn) gBtn.addEventListener("click", async () => {
      gBtn.disabled = true;
      // Google sends the guest back to this same page, signed in
      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: location.href.split("#")[0] },
      });
      if (error) {
        gBtn.disabled = false;
        const msg = form.querySelector("[data-msg]");
        msg.className = "msg err"; msg.textContent = error.message;
      }
    });
    let email = "";
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = form.querySelector("button");
      const msg = form.querySelector("[data-msg]");
      btn.disabled = true;
      email = form.email.value.trim().toLowerCase();
      remember(email);
      const { error } = await client.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: location.href.split("#")[0] },
      });
      btn.disabled = false;
      if (error) { msg.className = "msg err"; msg.textContent = error.message; return; }
      form.hidden = true;
      codeForm.hidden = false;
      codeForm.querySelector("[data-msg2]").className = "msg ok";
      codeForm.querySelector("[data-msg2]").textContent = `We have emailed a code to ${email}. It can take a minute; check spam if it does not arrive.`;
      codeForm.code.focus();
    });
    codeForm.querySelector("[data-again]").addEventListener("click", () => {
      codeForm.hidden = true; form.hidden = false; form.email.focus();
    });
    codeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = codeForm.querySelector("button[type=submit]");
      const msg = codeForm.querySelector("[data-msg2]");
      btn.disabled = true;
      const { error } = await client.auth.verifyOtp({ email, token: codeForm.code.value.trim(), type: "email" });
      btn.disabled = false;
      if (error) { msg.className = "msg err"; msg.textContent = "That code did not work. Check it, or ask for a new one."; return; }
      if (onSignedIn) onSignedIn();
    });
  }

  function profileForm(el, u, onSaved) {
    el.innerHTML = `
      <p class="kicker">Welcome</p>
      <p>Signed in as <strong>${esc(u.email)}</strong>. What name should Kai put at the table?</p>
      <form class="form" data-profile>
        <div class="row">
          <label>Full name <input name="full_name" required autocomplete="name"></label>
          <label>Mobile <span class="hint">optional</span>
            <input name="phone" type="tel" autocomplete="tel"></label>
        </div>
        <div class="actions"><button class="btn small" type="submit">Continue</button></div>
        <p class="msg" data-msg aria-live="polite"></p>
      </form>`;
    const form = el.querySelector("[data-profile]");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await client.from("profiles").insert({
        id: u.id, email: u.email,
        full_name: form.full_name.value.trim(),
        phone: form.phone.value.trim() || null,
      });
      if (error) {
        const msg = form.querySelector("[data-msg]");
        msg.className = "msg err"; msg.textContent = error.message; return;
      }
      onSaved();
    });
  }

  // Resolves to { user, profile } once the visitor is signed in and has a
  // profile; until then renders the sign-in or profile form into `el`.
  async function guest(el, onReady, lead) {
    const u = await user();
    if (!u) { signInForm(el, lead, onReady); return null; }
    let p = await profile(u);
    if (!p) {
      // invited by name: no need to ask again
      const { data: inv } = await client.from("invitations").select("name")
        .eq("email", (u.email || "").toLowerCase()).not("name", "is", null).limit(1);
      const meta = u.user_metadata || {};
      const name = (inv && inv[0] && inv[0].name) || meta.full_name || meta.name;
      if (name) {
        const { data } = await client.from("profiles")
          .insert({ id: u.id, email: u.email, full_name: name }).select().single();
        p = data;
      }
    }
    if (!p) { profileForm(el, u, onReady); return null; }
    return { user: u, profile: p };
  }

  function whoBar(el, g) {
    el.innerHTML = `Signed in as ${esc(g.profile.full_name)} &middot;
      <button class="linkish" type="button" data-signout>Sign out</button>`;
    el.querySelector("[data-signout]").addEventListener("click", async () => {
      await client.auth.signOut();
      location.reload();
    });
  }

  function notConfigured(el) {
    el.innerHTML = `<p class="muted" style="text-align:center;">Reservations open here soon.
      Until then, please let Kai know directly.</p>`;
  }

  // shrink a photo to a JPEG of at most 1600 px: quicker to upload, and a
  // format the label reader accepts (iPhone HEIC included, where the browser can decode it)
  async function shrinkImage(file) {
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * k);
      c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
      return blob || file;
    } catch (_) {
      return file;
    }
  }

  // ---------- the label camera ----------
  // Opens the rear camera inside the page with a label-shaped frame, and
  // resolves with the photo cropped to that frame (a Blob), or the file the
  // guest picked from their photos, or null if they closed it. Where the
  // camera is not available (permission refused, an in-app browser, a
  // desktop without a camera) it falls back to the phone's photo picker.
  function pickFile(capture) {
    return new Promise((resolve) => {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = "image/*";
      if (capture) inp.setAttribute("capture", "environment");
      inp.addEventListener("change", () => resolve(inp.files[0] || null), { once: true });
      inp.click();
    });
  }

  function cameraUnavailable() {
    return new Promise((resolve) => {
      const cam = document.createElement("div");
      cam.className = "cam cam-off";
      cam.setAttribute("role", "dialog");
      cam.innerHTML = `
        <div class="cam-sheet">
          <p>The camera is not available here, perhaps because access was not allowed, or the link
            opened inside another app.</p>
          <button type="button" class="btn small solid" data-pick>Take or choose a photo</button>
          <button type="button" class="linkish" data-cancel>Cancel</button>
        </div>`;
      document.body.appendChild(cam);
      const done = (r) => { cam.remove(); resolve(r); };
      cam.querySelector("[data-cancel]").addEventListener("click", () => done(null));
      cam.querySelector("[data-pick]").addEventListener("click", () => {
        const pick = pickFile(true);
        cam.remove();
        pick.then(resolve);
      });
    });
  }

  async function captureLabel() {
    const md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) return pickFile(true);

    let stream;
    try {
      stream = await md.getUserMedia({
        audio: false,
        // ask for the sharpest picture the rear camera offers; the crop is
        // only the label, so it needs the pixels for small print
        video: { facingMode: { ideal: "environment" }, width: { ideal: 4096 }, height: { ideal: 3072 } },
      });
    } catch (_) {
      // Safari only opens the photo picker straight from a tap, so offer a button
      return cameraUnavailable();
    }

    return new Promise((resolve) => {
      const cam = document.createElement("div");
      cam.className = "cam";
      cam.setAttribute("role", "dialog");
      cam.setAttribute("aria-label", "Photograph the label");
      cam.innerHTML = `
        <video playsinline autoplay muted></video>
        <div class="cam-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <p class="cam-hint">Fit the front label inside the frame</p>
        <div class="cam-bar">
          <button type="button" class="cam-side" data-photos>Choose from photos</button>
          <button type="button" class="cam-shutter" data-shoot aria-label="Take the photo"></button>
          <button type="button" class="cam-side" data-cancel>Cancel</button>
        </div>`;
      document.body.appendChild(cam);
      document.documentElement.classList.add("cam-open");
      const video = cam.querySelector("video");
      video.srcObject = stream;

      const done = (result) => {
        stream.getTracks().forEach((t) => t.stop());
        document.removeEventListener("keydown", onKey);
        document.documentElement.classList.remove("cam-open");
        cam.remove();
        resolve(result);
      };
      const onKey = (e) => { if (e.key === "Escape") done(null); };
      document.addEventListener("keydown", onKey);

      cam.querySelector("[data-cancel]").addEventListener("click", () => done(null));
      cam.querySelector("[data-photos]").addEventListener("click", async () => {
        stream.getTracks().forEach((t) => t.stop());
        const file = await pickFile(false);
        done(file);
      });
      cam.querySelector("[data-shoot]").addEventListener("click", () => {
        const vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || !vh) return;
        // the video fills the screen with object-fit: cover; map the frame
        // on screen back to the camera's own pixels, with a little margin
        const box = cam.getBoundingClientRect();
        const fr = cam.querySelector(".cam-frame").getBoundingClientRect();
        const k = Math.max(box.width / vw, box.height / vh);
        const offX = (box.width - vw * k) / 2, offY = (box.height - vh * k) / 2;
        const pad = 0.06;
        let sx = (fr.left - box.left - offX) / k, sy = (fr.top - box.top - offY) / k;
        let sw = fr.width / k, sh = fr.height / k;
        sx -= sw * pad; sy -= sh * pad; sw *= 1 + 2 * pad; sh *= 1 + 2 * pad;
        sx = Math.max(0, sx); sy = Math.max(0, sy);
        sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
        const scale = Math.min(1, 1600 / Math.max(sw, sh));
        const c = document.createElement("canvas");
        c.width = Math.round(sw * scale);
        c.height = Math.round(sh * scale);
        c.getContext("2d").drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
        cam.classList.add("cam-flash");
        c.toBlob((blob) => done(blob), "image/jpeg", 0.9);
      });
    });
  }

  async function event(slug) {
    const { data, error } = await client.from("events").select("*").eq("slug", slug || "").maybeSingle();
    if (error) throw error;
    return data;
  }

  window.WWK = {
    client, ready, esc, money, when, day, time, param, refundCutoff,
    errorText, callFn, rpc, user, profile, guest, whoBar, notConfigured, event, shrinkImage, captureLabel,
  };
})();

</script>
<script>
(function () {
  const W = window.WWK;
  const $ = (id) => document.getElementById(id);
  const page = $("page");
  const slug = W.param("event");

  if (!W.ready) { W.notConfigured(page); return; }

  // ---------- no evening chosen: list what is open ----------
  async function listOpen() {
    const { data } = await W.client.from("events").select("*")
      .eq("status", "open").gte("starts_at", new Date().toISOString()).order("starts_at");
    if (!data || !data.length) {
      page.innerHTML = `<p class="muted" style="text-align:center;">No evenings are open for reservation just now.
        See what is <a href="upcoming.html" style="color:var(--gold);">taking shape</a>.</p>`;
      return;
    }
    page.innerHTML = `<div class="themes">${data.map((ev) => `
      <article class="theme">
        <div class="t-index">${W.esc(W.day(ev.starts_at))}<span>${W.esc(ev.venue || "")}</span></div>
        <div class="t-body">
          <p class="t-title">${W.esc(ev.title)}</p>
          ${ev.subtitle ? `<p class="t-sub">${W.esc(ev.subtitle)}</p>` : ""}
          ${ev.description ? `<p class="t-desc">${W.esc(ev.description)}</p>` : ""}
          <div class="t-meta">
            <span class="tag">${ev.format === "byob" ? "Bring your own bottle" : "Curated line-up"}</span>
            ${ev.invite_only ? `<span class="tag">By invitation</span>` : ""}
          </div>
          <p style="margin:6px 0 0;"><a href="reserve.html?event=${encodeURIComponent(ev.slug)}"
            style="color:var(--gold); text-decoration:none; text-transform:uppercase; letter-spacing:0.14em; font-size:13px;">Reserve a seat &rarr;</a></p>
        </div>
      </article>`).join("")}</div>`;
  }

  // ---------- one evening ----------
  let ev, counts, me = null, seated = false, isAdmin = false, editing = null;

  const priceRange = () => {
    const lo = ev.price_min_cents, hi = ev.price_max_cents, c = ev.currency;
    if (lo != null && hi != null) return `${W.money(lo, c)} to ${W.money(hi, c)}`;
    if (lo != null) return `From ${W.money(lo, c)}`;
    if (hi != null) return `Up to ${W.money(hi, c)}`;
    return null;
  };
  const locked = () => (ev.bottle_lock_at && Date.now() >= new Date(ev.bottle_lock_at).getTime())
    || Date.now() >= new Date(ev.starts_at).getTime() || ev.status !== "open";
  const labelUrl = (path) => path ? W.client.storage.from("labels").getPublicUrl(path).data.publicUrl : null;

  async function load() {
    ev = await W.event(slug);
    if (!ev) {
      page.innerHTML = `<p class="muted" style="text-align:center;">This evening could not be found.
        <a href="reserve.html" style="color:var(--gold);">See the evenings open for reservation</a>.</p>`;
      return;
    }
    document.title = `${ev.title} · Wine with Kai`;
    $("eyebrow").innerHTML = `Wine with Kai &nbsp;&middot;&nbsp; ${ev.format === "byob" ? "Bring your own bottle" : "Reserve a seat"}`;
    $("title").textContent = ev.title;
    $("subtitle").textContent = ev.subtitle || "";
    $("subtitle").hidden = !ev.subtitle;
    $("bar").hidden = false;
    $("bar-when").textContent = W.when(ev.starts_at);
    $("bar-where").textContent = ev.venue || "";

    counts = (await W.rpc("event_counts", { p_slug: slug }))[0] || { seats_taken: 0, waitlisted: 0 };
    const left = Math.max(0, ev.seats - counts.seats_taken);
    const cutoff = W.refundCutoff(ev);

    const range = ev.format === "byob" ? priceRange() : null;
    page.innerHTML = `
      ${range || (ev.format === "byob" && ev.price_note) ? `
        <div class="banner" role="note">
          <p class="kicker" style="margin-bottom:2px;">Suggested bottle price for the evening</p>
          ${range ? `<p class="b-amt">${W.esc(range)}</p>` : ""}
          ${ev.price_note ? `<p>${W.esc(ev.price_note)}</p>` : ""}
        </div>` : ""}
      <dl class="facts">
        <div><dt>Date</dt><dd>${W.esc(W.when(ev.starts_at).split(" \u00b7 ")[0])}</dd></div>
        <div><dt>Time</dt><dd>${W.esc(W.time(ev.starts_at))}</dd></div>
        <div><dt>Location</dt><dd>${W.esc(ev.venue || "To be announced")}</dd></div>
        ${left ? "" : `<div><dt>Seats</dt><dd>Full &middot; ${counts.waitlisted} waiting</dd></div>`}
        ${ev.deposit_cents ? `<div><dt>Deposit</dt><dd>${W.money(ev.deposit_cents, ev.currency)}</dd></div>` : ""}
      </dl>
      ${ev.description ? `<p style="margin-top:26px;">${W.esc(ev.description)}</p>` : ""}
      ${ev.format === "byob" ? `
        <div class="banner">
          <p class="kicker" style="margin-bottom:4px;">Bring your own bottle</p>
          <p><a href="#line-up" data-jump style="color:var(--gold);">Click here to see the line-up and tally &rarr;</a></p>
        </div>` : ""}
      <div class="panel" id="guest"><p class="muted">Loading&hellip;</p></div>
      ${ev.format === "byob" ? `
        <div class="panel" id="mine" hidden></div>
        <h2 id="line-up" style="scroll-margin-top:16px;">The line-up</h2>
        <p class="muted">Bring a bottle you would like to share, or none at all. Every bottle shared${ev.shared_costs_cents
          ? `, with the evening&rsquo;s shared costs${ev.shared_costs_note ? ` (${W.esc(ev.shared_costs_note)})` : ""},` : ""}
        is added up and split evenly across the table: if your bottle comes to more than your share, Kai settles the
        difference with you.</p>
        <div id="lineup"><p class="muted">Loading&hellip;</p></div>
        <div id="tally"></div>` : ""}
      ${ev.deposit_cents ? `
        <p class="foot-note">The deposit holds your seat. It is refunded in full if you cancel on or before
        <strong>${W.esc(W.day(cutoff.toISOString()))}</strong>, ${ev.refund_days} days before the evening; after that it is kept.
        ${ev.format === "byob" ? "On the night, it counts towards your share of the tally." : "It counts towards the evening's cost."}</p>` : ""}
      <p class="foot-note" id="who"></p>`;

    const jump = page.querySelector("[data-jump]");
    if (jump) jump.addEventListener("click", (e) => {
      e.preventDefault();
      $("line-up").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    await renderGuest();
  }

  // the guest panel, then (for BYOB evenings) the bottle sections beneath it
  async function renderGuest() {
    seated = false;
    await renderGuestPanel();
    if (ev.format === "byob") await refresh();
  }

  async function renderGuestPanel() {
    const box = $("guest");
    const g = await W.guest(box, renderGuest,
      ev.invite_only
        ? `This evening is by invitation: sign in with the email address Kai invited${(window.WWK_CONFIG || {}).googleSignIn ? " (with Google, if that is your Google account)" : ", and we will email you a 6-digit code"}.`
        : null);
    if (!g) return;
    W.whoBar($("who"), g);
    me = g.user;
    const { data: adm } = await W.client.from("admins").select("email").limit(1);
    isAdmin = !!(adm && adm.length);

    const { data: mine } = await W.client.from("reservations").select("*")
      .eq("event_id", ev.id).eq("user_id", g.user.id).neq("status", "cancelled").maybeSingle();
    // a lapsed hold (checkout abandoned) reads as plain interest
    const lapsed = mine && mine.status === "pending" && !W.param("paid")
      && new Date(mine.hold_expires_at) < new Date();
    const status = !mine ? "none" : lapsed ? "interested" : mine.status;
    seated = status === "reserved";

    if (ev.invite_only && status === "none") {
      const { data: inv } = await W.client.from("invitations").select("email").eq("event_id", ev.id);
      if (!inv || !inv.length) {
        box.innerHTML = `<p class="kicker">By invitation</p>
          <p>This evening is by invitation, and we could not find one for <strong>${W.esc(g.user.email)}</strong>.
          If Kai invited you at another address, sign out and sign in with that one.</p>`;
        return;
      }
    }

    const left = Math.max(0, ev.seats - counts.seats_taken);
    const deposit = ev.deposit_cents ? W.money(ev.deposit_cents, ev.currency) : null;
    const reserveLabel = deposit ? `Reserve my seat &middot; ${deposit} deposit` : "Reserve my seat";
    const cutoff = W.refundCutoff(ev);
    const inTime = Date.now() <= cutoff.getTime();
    const html = [];

    if (status === "reserved") {
      html.push(`<p class="kicker">Your seat</p>
        <p><strong>Your seat is reserved.</strong> ${mine.deposit_paid_cents
          ? `Deposit of ${W.money(mine.deposit_paid_cents, ev.currency)} received${mine.paid_at ? ` on ${W.esc(W.day(mine.paid_at))}` : ""}.`
          : ""} We look forward to seeing you.</p>`);
      if (ev.format === "byob") {
        html.push(`<p class="muted" style="margin-top:8px;">Add the bottle you will bring just below.</p>`);
      }
      html.push(`<p class="foot-note" style="margin-top:22px;">${!mine.deposit_paid_cents
          ? "Plans changed?"
          : inTime
            ? `Plans changed? Cancel on or before ${W.esc(W.day(cutoff.toISOString()))} and your deposit is refunded in full.`
            : `The refund window closed on ${W.esc(W.day(cutoff.toISOString()))}. If you cancel now, the deposit is kept.`}
        <button class="linkish danger" type="button" data-act="cancel">Cancel my reservation</button></p>`);
    } else if (status === "pending" && W.param("paid")) {
      html.push(`<p class="kicker">Almost there</p><p>Payment received. Confirming your seat&hellip;</p>`);
      pollUntilReserved();
    } else if (status === "pending") {
      html.push(`<p class="kicker">Your seat is held</p>
        <p>We are holding a seat for you until <strong>${W.esc(W.time(mine.hold_expires_at))}</strong> while you pay the deposit.</p>
        <div class="actions">
          <button class="btn small solid" type="button" data-act="reserve">Continue to payment</button>
          <button class="linkish" type="button" data-act="cancel">Release the seat</button>
        </div>`);
    } else if (status === "waitlisted") {
      const pos = await W.rpc("my_waitlist_position", { p_slug: slug });
      const yours = left > 0 && pos && pos <= left;
      html.push(`<p class="kicker">Waitlist</p>`);
      html.push(yours
        ? `<p><strong>A seat has opened for you.</strong> Reserve it now to claim it.</p>
           <div class="actions"><button class="btn small solid" type="button" data-act="reserve">${reserveLabel}</button>
           <button class="linkish" type="button" data-act="withdraw">Leave the waitlist</button></div>`
        : `<p>You are <strong>number ${pos || "?"}</strong> on the waitlist. If a seat opens, it is offered in order:
           come back here, or Kai will be in touch.</p>
           <div class="actions"><button class="linkish" type="button" data-act="withdraw">Leave the waitlist</button></div>`);
    } else if (ev.status !== "open") {
      html.push(`<p>Reservations for this evening are ${ev.status === "draft" ? "not open yet" : "closed"}.</p>`);
    } else if (ev.deposit_cents == null) {
      html.push(`<p class="kicker">Seats open soon</p>`);
      html.push(status === "interested"
        ? `<p>You are on the interest list. Seats open as soon as the deposit is set, and Kai will let you know.</p>
           <div class="actions"><button class="linkish" type="button" data-act="withdraw">Withdraw my interest</button></div>`
        : `<p>The deposit for this evening is still being settled. Register your interest and Kai will let you know when seats open.</p>
           <div class="actions"><button class="btn small" type="button" data-act="interest">I&rsquo;m interested</button></div>`);
    } else {
      const queueFirst = counts.waitlisted >= left;
      html.push(`<p class="kicker">${left && !queueFirst ? "Seats are open" : "The table is full"}</p>`);
      html.push(left && !queueFirst
        ? `<p>${left === 1 ? "One seat is" : `${left} seats are`} left.${deposit ? ` A deposit of ${deposit} secures yours; you will pay it on Stripe&rsquo;s secure page, by PayNow or card.` : ""}</p>
           <div class="actions"><button class="btn small solid" type="button" data-act="reserve">${reserveLabel}</button>
           ${status === "interested" || !deposit ? "" : `<button class="linkish" type="button" data-act="interest">Just register interest</button>`}</div>`
        : `<p>Every seat is taken. Join the waitlist and, if a seat opens, it is offered in order.</p>
           <div class="actions"><button class="btn small" type="button" data-act="reserve">Join the waitlist</button></div>`);
      if (status === "interested") html.push(`<p class="foot-note">You are on the interest list for this evening.</p>`);
    }
    html.push(`<p class="msg" data-msg aria-live="polite"></p>`);
    box.innerHTML = html.join("");

    box.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => act(b, b.dataset.act, mine)));
  }

  async function act(btn, what, mine) {
    const msg = $("guest").querySelector("[data-msg]");
    const fail = (e) => { btn.disabled = false; msg.className = "msg err"; msg.textContent = W.errorText(e); };
    btn.disabled = true;
    try {
      if (what === "reserve") {
        const r = await W.callFn("create-deposit-checkout", { slug });
        if (r.url) { location.href = r.url; return; }
      } else if (what === "interest") {
        await W.rpc("register_interest", { p_slug: slug });
      } else if (what === "withdraw") {
        await W.rpc("withdraw", { p_slug: slug });
      } else if (what === "cancel") {
        const paid = mine && mine.status === "reserved" && mine.deposit_paid_cents > 0;
        const inTime = Date.now() <= W.refundCutoff(ev).getTime();
        const warn = !paid ? "Release your seat?"
          : inTime ? `Cancel your reservation? Your deposit of ${W.money(mine.deposit_paid_cents, ev.currency)} will be refunded in full.`
          : "Cancel your reservation? The refund window has passed, so the deposit will be kept.";
        if (!confirm(warn)) { btn.disabled = false; return; }
        const r = await W.callFn("cancel-reservation", { slug });
        if (r.refund_status === "refunded") {
          alert(`Cancelled. ${W.money(r.refunded_cents, ev.currency)} is on its way back to you; PayNow and card refunds usually arrive within 5 to 10 working days.`);
        }
      }
      await load();
      if (what === "reserve" && seated && $("mine")) $("mine").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { fail(e); }
  }

  async function renderLineup() {
    const rows = await W.rpc("event_lineup", { p_slug: slug });
    $("lineup").innerHTML = rows.length
      ? rows.map((b) => `
        <div class="bottle">
          <div class="yr">${b.vintage || "NV"}</div>
          <div>
            <p class="nm">${W.esc(b.producer)} &middot; ${W.esc(b.wine)}</p>
            <p class="sub">${b.region ? W.esc(b.region) + " &middot; " : ""}brought by ${W.esc(b.guest)}</p>
            ${b.background ? `<p class="bgtext">${W.esc(b.background)}</p>` : ""}
            ${b.photo_path ? `<img class="label" src="${W.esc(labelUrl(b.photo_path))}" alt="Label of ${W.esc(b.producer)} ${W.esc(b.wine)}" loading="lazy">` : ""}
          </div>
          <div class="side">${b.mine ? `<span class="pill ${b.status}">${b.status === "proposed" ? "awaiting Kai" : W.esc(b.status)}</span>` : ""}</div>
        </div>`).join("")
      : `<p class="muted">No bottles yet. The line-up builds here, oldest to youngest, as guests add their wines.</p>`;
  }

  async function renderMine() {
    const box = $("mine");
    if (!seated || !me) { box.hidden = true; return; }
    box.hidden = false;
    const g = { user: me };

    const { data: bottles } = await W.client.from("bottles").select("*")
      .eq("event_id", ev.id).eq("user_id", g.user.id).order("created_at");
    const closed = locked();
    const b = editing && bottles.find((x) => x.id === editing);

    box.innerHTML = `
      <p class="kicker">Your bottles</p>
      ${bottles.length ? bottles.map((x) => `
        <div class="bottle">
          <div class="yr">${x.vintage || "NV"}</div>
          <div>
            <p class="nm">${W.esc(x.producer)} &middot; ${W.esc(x.wine)}</p>
            <p class="sub">${x.region ? W.esc(x.region) + " &middot; " : ""}${W.money(x.price_cents, ev.currency)}
              ${x.admin_note ? ` &middot; Kai: ${W.esc(x.admin_note)}` : ""}</p>
          </div>
          <div class="side">
            <span class="pill ${x.status}">${x.status === "proposed" ? "awaiting Kai" : W.esc(x.status)}</span><br>
            ${closed ? "" : `<button class="linkish" type="button" data-edit="${x.id}">Edit</button> &middot;
            <button class="linkish danger" type="button" data-del="${x.id}">Remove</button>`}
          </div>
        </div>`).join("") : `<p class="muted">You have not added a bottle. That is fine: bringing one is optional.</p>`}
      ${closed
        ? `<p class="foot-note">The line-up is closed${ev.bottle_lock_at ? ` (it closed on ${W.esc(W.day(ev.bottle_lock_at))})` : ""}. For any change, please tell Kai.</p>`
        : `
      <h2 style="font-size:22px; margin-top:26px;">${b ? "Edit your bottle" : bottles.length ? "Add another bottle" : "Add your bottle"}</h2>
      <div class="assist">
        <button type="button" class="btn small solid snap" id="photo-btn">${b && b.photo_path ? "Photograph the label again" : "Photograph the label"}</button>
        <p class="hint-line">We read the label and write a short background for the line-up. You look it over,
          then add it. No photo to hand? Type the wine below and press <em>Write the background</em>.</p>
        <div class="assist-row">
          <img id="photo-preview" class="label" alt="Your label photo" ${b && b.photo_path ? `src="${W.esc(labelUrl(b.photo_path))}"` : "hidden"}>
          <ol class="steps" id="steps" aria-live="polite" hidden></ol>
        </div>
      </div>
      <form class="form" id="bottle-form">
        <div class="row">
          <label>Producer <input name="producer" required placeholder="Domaine Armand Rousseau" value="${W.esc(b ? b.producer : "")}"></label>
          <label>Wine <input name="wine" required placeholder="Gevrey-Chambertin 1er Cru Clos Saint-Jacques" value="${W.esc(b ? b.wine : "")}"></label>
        </div>
        <div class="row">
          <label>Vintage <span class="hint">leave blank for non-vintage</span>
            <input name="vintage" type="number" min="1800" max="2100" inputmode="numeric" value="${b && b.vintage ? b.vintage : ""}"></label>
          <label>Region <input name="region" placeholder="Gevrey-Chambertin, Burgundy" value="${W.esc(b ? b.region || "" : "")}"></label>
        </div>
        <div class="actions" style="margin-top:0;">
          <button class="linkish" type="button" id="look-up">Write the background</button>
          <span class="hint">a short note on the wine above, for the line-up</span>
        </div>
        <div id="background" hidden></div>
        <div class="row">
          <label>I&rsquo;d like to share my bottle for (${ev.currency.toUpperCase()}) <span class="hint" id="price-hint">${priceRange() ? `suggested ${W.esc(priceRange())}` : "the amount that goes into the tally"}</span>
            <input name="price" type="number" min="0" step="0.01" required inputmode="decimal" value="${b ? (b.price_cents / 100).toFixed(2) : ""}"></label>
          <label>Note for Kai <span class="hint">optional: where it is from, how it has been kept</span>
            <input name="note" value="${W.esc(b ? b.note || "" : "")}"></label>
        </div>
        <div class="actions">
          <button class="btn small solid" type="submit">${b ? "Save changes" : "Add to the line-up"}</button>
          ${b ? `<button class="linkish" type="button" id="cancel-edit">Cancel</button>` : ""}
        </div>
        <p class="msg" data-msg aria-live="polite"></p>
      </form>`}`;

    box.querySelectorAll("[data-edit]").forEach((el) => el.addEventListener("click", () => {
      editing = el.dataset.edit; renderMine();
    }));
    box.querySelectorAll("[data-del]").forEach((el) => el.addEventListener("click", async () => {
      const x = bottles.find((y) => y.id === el.dataset.del);
      if (!confirm(`Remove ${x.producer} ${x.wine} from the line-up?`)) return;
      await W.client.from("bottles").delete().eq("id", x.id);
      if (x.photo_path) await W.client.storage.from("labels").remove([x.photo_path]);
      if (editing === x.id) editing = null;
      refresh();
    }));
    const cancelEdit = $("cancel-edit");
    if (cancelEdit) cancelEdit.addEventListener("click", () => { editing = null; renderMine(); });
    const form = $("bottle-form");
    if (!form) return;

    // what the assistant has produced for this form so far
    const assist = { photo_path: null, lookup: null, busy: false };
    if (b && b.background) showBackground(b.background, assist);

    form.addEventListener("submit", (e) => { e.preventDefault(); save(form, g, b, assist); });
    $("photo-btn").addEventListener("click", async () => {
      const file = await W.captureLabel();
      if (file) fromPhoto(file, form, g, assist);
    });
    $("look-up").addEventListener("click", () => lookUp(form, assist));
  }

  // ---------- the bottle assistant ----------

  const STEPS = [["label", "Reading the label"], ["bg", "Writing the background"]];

  function steps(state, note) {
    const el = $("steps");
    el.hidden = false;
    el.innerHTML = STEPS.filter(([k]) => state[k]).map(([k, label]) => `
      <li class="${state[k]}"><span class="mark" aria-hidden="true">${state[k] === "done" ? "&#10003;" : state[k] === "fail" ? "&times;" : ""}</span>
        ${label}${state[k] === "busy" ? "&hellip;" : ""}</li>`).join("")
      + (note ? `<li class="note">${W.esc(note)}</li>` : "");
  }

  // one call reads the label and writes the background
  async function fromPhoto(file, form, g, assist) {
    if (assist.busy) return;
    assist.busy = true;
    const state = { label: "busy", bg: "busy" };
    steps(state);
    const preview = $("photo-preview");
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    try {
      const img = await W.shrinkImage(file);
      if (img.size > 5 * 1024 * 1024) throw new Error("That photo is too large; please try a smaller one.");
      const path = `${g.user.id}/${ev.id}/${Date.now()}.jpg`;
      const up = await W.client.storage.from("labels").upload(path, img, { contentType: img.type || "image/jpeg" });
      if (up.error) throw up.error;
      if (assist.photo_path) W.client.storage.from("labels").remove([assist.photo_path]);
      assist.photo_path = path;

      const r = await W.callFn("bottle-assist", { slug, step: "label", photo_path: path });
      if (!r.is_wine_label) {
        state.label = state.bg = "fail";
        steps(state, "That does not look like a wine label. Try another photo, or type the details below.");
        return;
      }
      if (r.producer) form.producer.value = r.producer;
      if (r.wine) form.wine.value = r.wine;
      form.vintage.value = /^\d{4}$/.test(r.vintage) ? r.vintage : "";
      if (r.region) form.region.value = r.region;
      state.label = "done";
      state.bg = r.background ? "done" : "fail";
      steps(state, r.unsure ? `Please check: ${r.unsure}` : r.background ? "" : "No background for this one; the line-up will show just the wine.");
      assist.lookup = r;
      if (r.background) showBackground(r.background, assist);
    } catch (e) {
      state.label = state.bg = "fail";
      steps(state, (e.message && !e.code ? e.message : W.errorText(e)) + " You can type the details below instead.");
    } finally {
      assist.busy = false;
    }
  }

  // background for a wine typed in by hand
  async function lookUp(form, assist) {
    if (assist.busy) return;
    const wine = {
      producer: form.producer.value.trim(), wine: form.wine.value.trim(),
      vintage: form.vintage.value.trim(), region: form.region.value.trim(),
    };
    if (!wine.producer && !wine.wine) { form.producer.focus(); return; }
    assist.busy = true;
    const state = { bg: "busy" };
    steps(state);
    try {
      const r = await W.callFn("bottle-assist", { slug, step: "describe", ...wine });
      state.bg = r.background ? "done" : "fail";
      steps(state, r.background ? "" : "No background for this one; the line-up will show just the wine.");
      assist.lookup = r;
      if (r.background) showBackground(r.background, assist);
    } catch (e) {
      state.bg = "fail";
      steps(state, W.errorText(e) + " You can still add the bottle without it.");
    } finally {
      assist.busy = false;
    }
  }

  function showBackground(text, assist) {
    const el = $("background");
    el.hidden = false;
    el.innerHTML = `
      <div class="market">
        <p class="kicker">Background, for the line-up</p>
        <p class="bgtext">${W.esc(text)}</p>
        <p class="foot-note">Written by our assistant from the details above.
          <button class="linkish" type="button" data-drop-bg>Leave it out</button></p>
      </div>`;
    el.querySelector("[data-drop-bg]").addEventListener("click", () => {
      assist.lookup = { lookup_id: null };
      el.hidden = true;
    });
  }

  async function save(form, g, b, assist) {
    const msg = form.querySelector("[data-msg]");
    const btn = form.querySelector("button[type=submit]");
    if (assist.busy && !confirm("The assistant is still working. Add the bottle without waiting for it?")) return;
    const price_cents = Math.round(parseFloat(form.price.value) * 100);
    const lo = ev.price_min_cents, hi = ev.price_max_cents;
    if ((lo != null && price_cents < lo) || (hi != null && price_cents > hi)) {
      if (!confirm(`${W.money(price_cents, ev.currency)} is outside the evening's suggested range of ${priceRange()}. Add it anyway?`)) return;
    }
    btn.disabled = true;
    try {
      const row = {
        event_id: ev.id,
        user_id: g.user.id,
        producer: form.producer.value.trim(),
        wine: form.wine.value.trim(),
        vintage: form.vintage.value ? parseInt(form.vintage.value, 10) : null,
        region: form.region.value.trim() || null,
        price_cents,
        note: form.note.value.trim() || null,
      };
      // the background is copied server-side from this lookup (null leaves it out)
      if (assist.lookup) row.lookup_id = assist.lookup.lookup_id;
      if (assist.photo_path) row.photo_path = assist.photo_path;
      const res = b
        ? await W.client.from("bottles").update(row).eq("id", b.id)
        : await W.client.from("bottles").insert(row);
      if (res.error) throw res.error;
      if (b && assist.photo_path && b.photo_path) await W.client.storage.from("labels").remove([b.photo_path]);
      editing = null;
      await refresh();
    } catch (e) {
      btn.disabled = false;
      msg.className = "msg err";
      msg.textContent = e.message || W.errorText(e);
    }
  }

  async function renderTally() {
    const box = $("tally");
    if (!seated && !isAdmin) { box.innerHTML = ""; return; }
    let rows;
    try { rows = await W.rpc("event_tally", { p_slug: slug }); }
    catch (e) { box.innerHTML = ""; return; }
    if (!rows.length) { box.innerHTML = ""; return; }

    const c = ev.currency;
    const bottlesTotal = rows.reduce((a, r) => a + r.bottles_cents, 0);
    const total = bottlesTotal + ev.shared_costs_cents;
    const balance = (v) => v > 0
      ? `<span class="owes">pays ${W.money(v, c)}</span>`
      : v < 0 ? `<span class="gets">receives ${W.money(-v, c)}</span>` : "square";

    box.innerHTML = `
      <h2>The tally</h2>
      <p class="muted">Shared with the guests at the table. It updates as bottles are added, and is final once the line-up closes.</p>
      <div class="table-wrap"><table class="ledger">
        <thead><tr><th>Guest</th><th class="num opt">Bottles</th><th class="num">Shared</th>
          <th class="num opt">Deposit</th><th class="num">Share</th><th class="num">On the night</th></tr></thead>
        <tbody>${rows.map((r) => `
          <tr class="${r.mine ? "me" : ""}"><td>${W.esc(r.guest)}${r.mine ? " (you)" : ""}${r.settled ? ` <span class="pill">settled</span>` : ""}</td>
            <td class="num opt">${r.bottles}</td><td class="num">${W.money(r.bottles_cents, c)}</td>
            <td class="num opt">${W.money(r.deposit_cents, c)}</td><td class="num">${W.money(r.share_cents, c)}</td>
            <td class="num">${balance(r.balance_cents)}</td></tr>`).join("")}
        </tbody>
      </table></div>
      <p class="muted" style="font-size:16.5px;">Bottles shared ${W.money(bottlesTotal, c)} &middot;
        ${ev.shared_costs_cents ? `shared costs${ev.shared_costs_note ? ` (${W.esc(ev.shared_costs_note)})` : ""} ${W.money(ev.shared_costs_cents, c)} &middot;` : ""}
        <strong>total ${W.money(total, c)}</strong>, split ${rows.length} ways.
        ${ev.deposit_cents ? `<span class="only-narrow">Your deposit is already taken off your figure.</span>` : ""}</p>
      <p class="foot-note">Share = every bottle shared${ev.shared_costs_cents ? " plus the shared costs" : ""}, divided by the guests at the table.
        On the night = share, less your own bottles${ev.deposit_cents ? " and your deposit" : ""}. Shares are rounded to the cent, so the
        column may differ from the total by a few cents. All settling is with Kai.</p>`;
  }

  async function refresh() {
    await Promise.all([renderLineup(), renderMine(), renderTally()]);
  }

  // the webhook usually lands within seconds of Stripe's redirect
  let polls = 0;
  function pollUntilReserved() {
    if (polls++ > 15) {
      const msg = $("guest").querySelector("[data-msg]");
      if (msg) msg.textContent = "Still confirming. Your payment is safe; refresh this page in a minute.";
      return;
    }
    setTimeout(async () => {
      const u = await W.user();
      const { data } = await W.client.from("reservations").select("status")
        .eq("event_id", ev.id).eq("user_id", u.id).neq("status", "cancelled").maybeSingle();
      if (data && data.status === "reserved") {
        history.replaceState(null, "", `reserve.html?event=${encodeURIComponent(slug)}`);
        load();
      } else {
        pollUntilReserved();
      }
    }, 2000);
  }

  (slug ? load() : listOpen()).catch((e) => {
    page.innerHTML = `<p class="msg err" style="text-align:center;">${W.esc(W.errorText(e))}</p>`;
  });
})();
</script>
</body>
</html>
