/* =========================================================
   Wine with Kai · shared styles
   Curated wine dinners, Singapore
   ========================================================= */

:root {
  --bg:        #160a0c;
  --bg-2:      #1d1013;
  --panel:     #201215;
  --ink:       #ece3d6;
  --ink-soft:  #bdae9f;
  --ink-faint: #8c7d71;
  --gold:      #c9a24b;
  --gold-soft: #d8bd7e;
  /* red removed from the palette; these now carry the gold accent */
  --crimson:   #c9a24b;
  --crimson-2: #c9a24b;
  --line:      rgba(236, 227, 214, 0.11);
  --line-soft: rgba(236, 227, 214, 0.06);

  --serif:   'EB Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  /* headers now share the eyebrow's serif (EB Garamond) for consistency */
  --display: 'EB Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif;

  --maxw: 820px;

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.72;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--gold); color: #201013; }

a { color: inherit; }

/* Visible keyboard focus, on-brand for the dark theme.
   Uses :focus-visible so it shows for keyboard/switch users
   without ringing on mouse clicks. */
a:focus-visible,
.btn:focus-visible,
.next-card:focus-visible,
.home-link:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
  border-radius: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.001ms !important;
    animation-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

img { max-width: 100%; display: block; }

.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 28px;
}

/* ---------- Eyebrow / small-caps kicker ---------- */
.eyebrow {
  font-family: var(--serif);
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.34em;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  margin: 0;
}

/* ---------- Thin rules ---------- */
.rule-crimson {
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold) 14%, var(--gold) 86%, transparent);
  border: 0;
  opacity: 0.72;
  max-width: var(--maxw);
  margin: 0 auto;
  width: calc(100% - 56px);
}
.tick {
  width: 44px;
  height: 1px;
  background: var(--gold);
  border: 0;
  opacity: 0.85;
  margin: 0 0 20px;
}

/* =========================================================
   HERO (landing)
   ========================================================= */
.hero-scene {
  position: relative;
  height: 40vh;
  min-height: 300px;
  max-height: 440px;
  overflow: hidden;
  background: #0d0708;
}
.hero-scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-scene::after {
  /* fade the bottom of the scene into the page */
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 46%;
  background: linear-gradient(to bottom, rgba(22,10,12,0) 0%, var(--bg) 96%);
}

.hero-body { padding: 46px 0 8px; }

.masthead {
  text-align: center;
  padding-top: 30px;
}
.masthead .kick { margin-bottom: 26px; }

.title-display {
  font-family: var(--display);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.02;
  letter-spacing: 0.01em;
  margin: 0;
  font-size: clamp(46px, 9vw, 74px);
}
.title-connector {
  display: block;
  font-family: var(--display);
  font-style: italic;
  font-weight: 500;
  color: var(--gold);
  font-size: clamp(22px, 3.4vw, 30px);
  line-height: 1.2;
  margin: 2px 0;
  letter-spacing: 0.01em;
}

.gold-divider {
  width: min(560px, 82%);
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold) 18%, var(--gold) 82%, transparent);
  border: 0;
  margin: 30px auto 26px;
  opacity: 0.85;
}

.lede {
  text-align: center;
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(21px, 3.1vw, 27px);
  color: var(--ink);
  margin: 0 auto 8px;
  max-width: 640px;
  line-height: 1.35;
}
.lede-sub {
  text-align: center;
  font-style: italic;
  color: var(--ink-faint);
  font-size: 18px;
  line-height: 1.5;
  margin: 0 auto 4px;
  max-width: 560px;
}

/* =========================================================
   WINE LINEUP (landing list)
   ========================================================= */
.lineup { margin: 6px 0 4px; }

.flight {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 6px 22px;
  align-items: baseline;
  padding: 22px 4px;
  border-top: 1px solid var(--line-soft);
}
.flight:last-child { border-bottom: 1px solid var(--line-soft); }

.flight-yr {
  font-family: var(--display);
  color: var(--crimson);
  font-size: 32px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: 0.01em;
}
.flight-main { }
.flight-name {
  font-family: var(--display);
  font-size: 24px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.18;
  margin: 0 0 4px;
}
.flight-sub {
  color: var(--ink-faint);
  font-size: 16.5px;
  font-style: italic;
  line-height: 1.4;
  margin: 0;
}
.flight-order {
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  align-self: center;
}

/* ---------- CTA ---------- */
.cta-row { text-align: center; margin: 40px 0 8px; }
.btn {
  display: inline-block;
  font-family: var(--serif);
  font-size: 16px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
  text-decoration: none;
  padding: 15px 34px;
  border: 1px solid var(--gold);
  border-radius: 2px;
  transition: background .25s ease, color .25s ease;
}
.btn:hover { background: var(--gold); color: #201013; }
.btn .arw { color: var(--gold); margin-left: 8px; transition: color .25s ease; }
.btn:hover .arw { color: #201013; }

.note-line {
  text-align: center;
  font-style: italic;
  color: var(--ink-faint);
  font-size: 16px;
  line-height: 1.55;
  max-width: 620px;
  margin: 26px auto 0;
}

/* =========================================================
   EVENT FOOTER BAR
   ========================================================= */
.event-bar {
  background: var(--bg-2);
  border-top: 1px solid rgba(201, 162, 75, 0.5);
  border-bottom: 1px solid rgba(201, 162, 75, 0.5);
  color: var(--ink);
  text-align: center;
  padding: 30px 24px;
  margin-top: 54px;
}
.event-bar .when {
  font-family: var(--display);
  font-weight: 500;
  color: var(--gold-soft);
  font-size: clamp(21px, 3.4vw, 27px);
  margin: 0 0 6px;
  letter-spacing: 0.02em;
}
.event-bar .where {
  font-family: var(--serif);
  font-size: 18px;
  color: var(--ink-soft);
  margin: 0;
  letter-spacing: 0.02em;
}

.page-foot {
  text-align: center;
  color: var(--ink-faint);
  font-size: 14px;
  font-style: italic;
  padding: 26px 20px 40px;
}

/* =========================================================
   WINES PAGE
   ========================================================= */
.page-head { text-align: center; padding: 40px 0 6px; }
.page-head .eyebrow { margin-bottom: 20px; }
.page-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(40px, 7vw, 60px);
  line-height: 1.05;
  margin: 0;
}
.page-title .it {
  display: block;
  font-style: italic;
  font-weight: 500;
  color: var(--gold);
  font-size: clamp(19px, 3vw, 26px);
  margin-top: 4px;
}

.section { padding: 20px 0; }
.section h2 {
  font-family: var(--display);
  color: var(--gold);
  font-weight: 600;
  font-size: 27px;
  margin: 30px 0 14px;
  letter-spacing: 0.01em;
}
.section p { margin: 0 0 18px; color: var(--ink); }
.section p.muted { color: var(--ink-soft); }
em, .i { font-style: italic; }
strong, .b { font-weight: 600; color: var(--ink); }

/* ---------- Wine entries ---------- */
.wines { margin-top: 8px; }

.wine {
  border-top: 1px solid var(--line);
  padding: 34px 0 30px;
  scroll-margin-top: 20px;
}
.wine-head {
  display: grid;

<script>
// Wine with Kai · shared helpers for the reservation, BYOB and admin pages.
// Needs supabase-js (UMD build) and wwk-config.js loaded first.
(function () {
  const cfg = window.WWK_CONFIG || {};
  const ready = !!(cfg.supabaseUrl && cfg.supabaseAnonKey && window.supabase);
  const client = ready
    ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
        // implicit flow: the emailed link works even if opened in another browser
        auth: { flowType: "implicit", persistSession: true, detectSessionInUrl: true },
      })
    : null;

  const TZ = "Asia/Singapore";

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function money(cents, currency) {
    if (cents == null) return "";
    const sym = (currency || "sgd").toLowerCase() === "sgd" ? "S$" : (currency || "").toUpperCase() + " ";
    const neg = cents < 0;
    const abs = Math.abs(cents);
    const whole = abs % 100 === 0;
    const n = (abs / 100).toLocaleString("en-SG", {
      minimumFractionDigits: whole ? 0 : 2,
      maximumFractionDigits: 2,
    });
    return (neg ? "-" : "") + sym + n;
  }

  function parts(iso, opts) {
    const out = {};
    new Intl.DateTimeFormat("en-GB", Object.assign({ timeZone: TZ }, opts))
      .formatToParts(new Date(iso)).forEach((p) => { out[p.type] = p.value; });
    return out;
  }

  // "Thursday 8 October 2026 · 7:00 pm"
  function when(iso) {
    const d = parts(iso, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    return `${d.weekday} ${d.day} ${d.month} ${d.year} · ${time(iso)}`;
  }
  // "8 October 2026"
  function day(iso) {
    const d = parts(iso, { day: "numeric", month: "long", year: "numeric" });
    return `${d.day} ${d.month} ${d.year}`;
  }
  function time(iso) {
    const t = parts(iso, { hour: "numeric", minute: "2-digit", hour12: true });
    return `${t.hour}:${t.minute} ${(t.dayPeriod || "").toLowerCase()}`;
  }

  function param(name) {
    return new URLSearchParams(location.search).get(name);
  }

  // the last moment a cancellation still gets the deposit back
  function refundCutoff(ev) {
    return new Date(new Date(ev.starts_at).getTime() - ev.refund_days * 86400000);
  }

  const ERRORS = {
    not_signed_in: "Please sign in first.",
    no_profile: "Please add your name first.",
    event_not_found: "This evening could not be found.",
    event_not_open: "Reservations for this evening are not open.",
    deposit_not_set: "The deposit has not been set yet, so seats cannot be reserved just yet.",
    event_started: "This evening has already begun.",
    not_invited: "This evening is by invitation. Sign in with the email address your invitation was sent to.",
    not_a_guest: "The tally is shared with seated guests only.",
    checkout_failed: "The payment page could not be opened. Please try again in a moment.",
    refund_failed: "The refund could not be issued automatically. Kai has been told; nothing has been cancelled yet.",
    no_reservation: "There is no reservation to cancel.",
    too_many_lookups: "You have used today's bottle look-ups. Please type the details and Kai will check the price.",
    assist_refused: "The assistant could not help with this one.",
    assist_failed: "The assistant could not finish this time.",
    assist_busy: "The assistant is busy just now. Please try again in a minute.",
    nothing_to_look_up: "Add the producer or the wine first.",
    bad_photo: "That photo could not be used. Please try another.",
  };
  function errorText(e) {
    const code = (e && (e.code || e.message)) || String(e);
    for (const k in ERRORS) if (code.indexOf(k) !== -1) return ERRORS[k];
    return "Something went wrong: " + code;
  }

  // call an edge function; surfaces the { error } code it returns
  async function callFn(name, body) {
    const { data, error } = await client.functions.invoke(name, { body });
    if (error) {
      let code = error.message;
      try { code = (await error.context.json()).error || code; } catch (_) {}
      throw { code };
    }
    return data;
  }

  async function rpc(fn, args) {
    const { data, error } = await client.rpc(fn, args);
    if (error) throw error;
    return data;
  }

  async function user() {
    if (!client) return null;
    const { data } = await client.auth.getSession();
    return data.session ? data.session.user : null;
  }

  async function profile(u) {
    const { data } = await client.from("profiles").select("*").eq("id", u.id).maybeSingle();
    return data;
  }

  const LAST_EMAIL = "wwk-email";
  const remembered = () => { try { return localStorage.getItem(LAST_EMAIL) || ""; } catch (_) { return ""; } };
  const remember = (v) => { try { localStorage.setItem(LAST_EMAIL, v); } catch (_) {} };

  // Two steps on the same page: email, then the code from the email.
  // The email also carries a link, which signs in just as well.
  function signInForm(el, lead, onSignedIn) {
    const google = !!cfg.googleSignIn;
    el.innerHTML = `
      <p class="kicker">Sign in</p>
      <p>${lead || (google ? "One tap with Google, or we can email you a 6-digit code." : "Enter your email and we will send you a 6-digit code. No password needed.")}</p>
      ${google ? `
      <div class="actions" style="margin:4px 0 14px;">
        <button class="btn small solid google" type="button" data-google>
          <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Continue with Google</button>
      </div>
      <p class="hint-or">or with your email</p>` : ""}
      <form class="form" data-signin>
        <label>Email <input type="email" name="email" required autocomplete="email" value="${esc(remembered())}"></label>
        <div class="actions"><button class="btn small solid" type="submit">Email me a code</button></div>
        <p class="msg" data-msg aria-live="polite"></p>
      </form>
      <form class="form" data-code hidden>
        <label>The code from your email
          <input name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}"
            maxlength="10" placeholder="123456" style="letter-spacing:0.3em; font-size:22px; max-width:220px;"></label>
        <div class="actions">
          <button class="btn small solid" type="submit">Sign in</button>
          <button class="linkish" type="button" data-again>Use another email</button>
        </div>
        <p class="msg" data-msg2 aria-live="polite"></p>
      </form>`;
    const form = el.querySelector("[data-signin]");
    const codeForm = el.querySelector("[data-code]");
    const gBtn = el.querySelector("[data-google]");
    if (gBtn) gBtn.addEventListener("click", async () => {
      gBtn.disabled = true;
      // Google sends the guest back to this same page, signed in
      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: location.href.split("#")[0] },
      });
      if (error) {
        gBtn.disabled = false;
        const msg = form.querySelector("[data-msg]");
        msg.className = "msg err"; msg.textContent = error.message;
      }
    });
    let email = "";
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = form.querySelector("button");
      const msg = form.querySelector("[data-msg]");
      btn.disabled = true;
      email = form.email.value.trim().toLowerCase();
      remember(email);
      const { error } = await client.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: location.href.split("#")[0] },
      });
      btn.disabled = false;
      if (error) { msg.className = "msg err"; msg.textContent = error.message; return; }
      form.hidden = true;
      codeForm.hidden = false;
      codeForm.querySelector("[data-msg2]").className = "msg ok";
      codeForm.querySelector("[data-msg2]").textContent = `We have emailed a code to ${email}. It can take a minute; check spam if it does not arrive.`;
      codeForm.code.focus();
    });
    codeForm.querySelector("[data-again]").addEventListener("click", () => {
      codeForm.hidden = true; form.hidden = false; form.email.focus();
    });
    codeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = codeForm.querySelector("button[type=submit]");
      const msg = codeForm.querySelector("[data-msg2]");
      btn.disabled = true;
      const { error } = await client.auth.verifyOtp({ email, token: codeForm.code.value.trim(), type: "email" });
      btn.disabled = false;
      if (error) { msg.className = "msg err"; msg.textContent = "That code did not work. Check it, or ask for a new one."; return; }
      if (onSignedIn) onSignedIn();
    });
  }

  function profileForm(el, u, onSaved) {
    el.innerHTML = `
      <p class="kicker">Welcome</p>
      <p>Signed in as <strong>${esc(u.email)}</strong>. What name should Kai put at the table?</p>
      <form class="form" data-profile>
        <div class="row">
          <label>Full name <input name="full_name" required autocomplete="name"></label>
          <label>Mobile <span class="hint">optional</span>
            <input name="phone" type="tel" autocomplete="tel"></label>
        </div>
        <div class="actions"><button class="btn small" type="submit">Continue</button></div>
        <p class="msg" data-msg aria-live="polite"></p>
      </form>`;
    const form = el.querySelector("[data-profile]");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await client.from("profiles").insert({
        id: u.id, email: u.email,
        full_name: form.full_name.value.trim(),
        phone: form.phone.value.trim() || null,
      });
      if (error) {
        const msg = form.querySelector("[data-msg]");
        msg.className = "msg err"; msg.textContent = error.message; return;
      }
      onSaved();
    });
  }

  // Resolves to { user, profile } once the visitor is signed in and has a
  // profile; until then renders the sign-in or profile form into `el`.
  async function guest(el, onReady, lead) {
    const u = await user();
    if (!u) { signInForm(el, lead, onReady); return null; }
    let p = await profile(u);
    if (!p) {
      // invited by name: no need to ask again
      const { data: inv } = await client.from("invitations").select("name")
        .eq("email", (u.email || "").toLowerCase()).not("name", "is", null).limit(1);
      const meta = u.user_metadata || {};
      const name = (inv && inv[0] && inv[0].name) || meta.full_name || meta.name;
      if (name) {
        const { data } = await client.from("profiles")
          .insert({ id: u.id, email: u.email, full_name: name }).select().single();
        p = data;
      }
    }
    if (!p) { profileForm(el, u, onReady); return null; }
    return { user: u, profile: p };
  }

  function whoBar(el, g) {
    el.innerHTML = `Signed in as ${esc(g.profile.full_name)} &middot;
      <button class="linkish" type="button" data-signout>Sign out</button>`;
    el.querySelector("[data-signout]").addEventListener("click", async () => {
      await client.auth.signOut();
      location.reload();
    });
  }

  function notConfigured(el) {
    el.innerHTML = `<p class="muted" style="text-align:center;">Reservations open here soon.
      Until then, please let Kai know directly.</p>`;
  }

  // shrink a photo to a JPEG of at most 1600 px: quicker to upload, and a
  // format the label reader accepts (iPhone HEIC included, where the browser can decode it)
  async function shrinkImage(file) {
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * k);
      c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
      return blob || file;
    } catch (_) {
      return file;
    }
  }

  // ---------- the label camera ----------
  // Opens the rear camera inside the page with a label-shaped frame, and
  // resolves with the photo cropped to that frame (a Blob), or the file the
  // guest picked from their photos, or null if they closed it. Where the
  // camera is not available (permission refused, an in-app browser, a
  // desktop without a camera) it falls back to the phone's photo picker.
  function pickFile(capture) {
    return new Promise((resolve) => {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = "image/*";
      if (capture) inp.setAttribute("capture", "environment");
      inp.addEventListener("change", () => resolve(inp.files[0] || null), { once: true });
      inp.click();
    });
  }

  function cameraUnavailable() {
    return new Promise((resolve) => {
      const cam = document.createElement("div");
      cam.className = "cam cam-off";
      cam.setAttribute("role", "dialog");
      cam.innerHTML = `
        <div class="cam-sheet">
          <p>The camera is not available here, perhaps because access was not allowed, or the link
            opened inside another app.</p>
          <button type="button" class="btn small solid" data-pick>Take or choose a photo</button>
          <button type="button" class="linkish" data-cancel>Cancel</button>
        </div>`;
      document.body.appendChild(cam);
      const done = (r) => { cam.remove(); resolve(r); };
      cam.querySelector("[data-cancel]").addEventListener("click", () => done(null));
      cam.querySelector("[data-pick]").addEventListener("click", () => {
        const pick = pickFile(true);
        cam.remove();
        pick.then(resolve);
      });
    });
  }

  async function captureLabel() {
    const md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) return pickFile(true);

    let stream;
    try {
      stream = await md.getUserMedia({
        audio: false,
        // ask for the sharpest picture the rear camera offers; the crop is
        // only the label, so it needs the pixels for small print
        video: { facingMode: { ideal: "environment" }, width: { ideal: 4096 }, height: { ideal: 3072 } },
      });
    } catch (_) {
      // Safari only opens the photo picker straight from a tap, so offer a button
      return cameraUnavailable();
    }

    return new Promise((resolve) => {
      const cam = document.createElement("div");
      cam.className = "cam";
      cam.setAttribute("role", "dialog");
      cam.setAttribute("aria-label", "Photograph the label");
      cam.innerHTML = `
        <video playsinline autoplay muted></video>
        <div class="cam-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <p class="cam-hint">Fit the front label inside the frame</p>
        <div class="cam-bar">
          <button type="button" class="cam-side" data-photos>Choose from photos</button>
          <button type="button" class="cam-shutter" data-shoot aria-label="Take the photo"></button>
          <button type="button" class="cam-side" data-cancel>Cancel</button>
        </div>`;
      document.body.appendChild(cam);
      document.documentElement.classList.add("cam-open");
      const video = cam.querySelector("video");
      video.srcObject = stream;

      const done = (result) => {
        stream.getTracks().forEach((t) => t.stop());
        document.removeEventListener("keydown", onKey);
        document.documentElement.classList.remove("cam-open");
        cam.remove();
        resolve(result);
      };
      const onKey = (e) => { if (e.key === "Escape") done(null); };
      document.addEventListener("keydown", onKey);

      cam.querySelector("[data-cancel]").addEventListener("click", () => done(null));
      cam.querySelector("[data-photos]").addEventListener("click", async () => {
        stream.getTracks().forEach((t) => t.stop());
        const file = await pickFile(false);
        done(file);
      });
      cam.querySelector("[data-shoot]").addEventListener("click", () => {
        const vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || !vh) return;
        // the video fills the screen with object-fit: cover; map the frame
        // on screen back to the camera's own pixels, with a little margin
        const box = cam.getBoundingClientRect();
        const fr = cam.querySelector(".cam-frame").getBoundingClientRect();
        const k = Math.max(box.width / vw, box.height / vh);
        const offX = (box.width - vw * k) / 2, offY = (box.height - vh * k) / 2;
        const pad = 0.06;
        let sx = (fr.left - box.left - offX) / k, sy = (fr.top - box.top - offY) / k;
        let sw = fr.width / k, sh = fr.height / k;
        sx -= sw * pad; sy -= sh * pad; sw *= 1 + 2 * pad; sh *= 1 + 2 * pad;
        sx = Math.max(0, sx); sy = Math.max(0, sy);
        sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
        const scale = Math.min(1, 1600 / Math.max(sw, sh));
        const c = document.createElement("canvas");
        c.width = Math.round(sw * scale);
        c.height = Math.round(sh * scale);
        c.getContext("2d").drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
        cam.classList.add("cam-flash");
        c.toBlob((blob) => done(blob), "image/jpeg", 0.9);
      });
    });
  }

  async function event(slug) {
    const { data, error } = await client.from("events").select("*").eq("slug", slug || "").maybeSingle();
    if (error) throw error;
    return data;
  }

  window.WWK = {
    client, ready, esc, money, when, day, time, param, refundCutoff,
    errorText, callFn, rpc, user, profile, guest, whoBar, notConfigured, event, shrinkImage, captureLabel,
  };
})();

</script>
<script>
(function () {

  // ---------- Singapore time <-> <input type="datetime-local"> ----------
  function toLocalInput(iso) {
    if (!iso) return "";
    const p = {};
    new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Singapore", year: "numeric", month: "2-digit",
      day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date(iso)).forEach((x) => { p[x.type] = x.value; });
    return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
  }
  const fromLocalInput = (v) => v ? new Date(`${v}:00+08:00`).toISOString() : null;
  const toCents = (v) => v === "" || v == null ? null : Math.round(parseFloat(v) * 100);
  const toDollars = (c) => c == null ? "" : (c / 100).toFixed(2).replace(/\.00$/, "");

  async function start() {
    const box = document.createElement("div");
    box.className = "panel";
    page.innerHTML = "";
    page.appendChild(box);
    const g = await W.guest(box, start, "Sign in with the host's email.");
    if (!g) return;
    W.whoBar($("who"), g);
    const { data: a } = await W.client.from("admins").select("email").limit(1);
    if (!a || !a.length) {
      box.innerHTML = `<p>This page is for the host. You are signed in as <strong>${esc(g.user.email)}</strong>.</p>`;
      return;
    }
    await loadEvents();
    renderLab(g);
  }

  // ---------- try the bottle assistant on any photo ----------
  function renderLab(g) {
    const lab = $("lab");
    const byob = events.find((e) => e.format === "byob");
    lab.hidden = false;
    lab.innerHTML = `
      <div class="panel">
        <p class="kicker">Test the bottle assistant</p>
        ${byob ? `
        <p class="muted">Try the label reader on any bottle. Nothing is added to an evening. Each test reads the label
          and writes the background note in one step, exactly as it will for guests (a few US cents a test).
          To add your own bottle to an evening, reserve your seat on the evening page: the same camera leads
          straight to <em>Check and add</em>.</p>
        <button type="button" class="btn small solid snap" id="lab-photo">Photograph a label</button>
        <div class="assist-row">
          <img id="lab-img" class="label" alt="The label being tested" hidden>
          <ol class="steps" id="lab-steps" aria-live="polite" hidden></ol>
        </div>
        <div id="lab-out"></div>` : `<p class="muted">Create a bring-your-own-bottle evening first; the test runs against it.</p>`}
      </div>`;
    if (!byob) return;

    const stepsEl = $("lab-steps");
    const show = (state, note) => {
      stepsEl.hidden = false;
      const rows = [["label", "Reading the label and writing the background"]];
      stepsEl.innerHTML = rows.filter(([k]) => state[k]).map(([k, t]) => `
        <li class="${state[k]}"><span class="mark" aria-hidden="true">${state[k] === "done" ? "&#10003;" : state[k] === "fail" ? "&times;" : ""}</span>
        ${t}${state[k] === "busy" ? "&hellip;" : ""}</li>`).join("") + (note ? `<li class="note">${esc(note)}</li>` : "");
    };

    $("lab-photo").addEventListener("click", async () => {
      const file = await W.captureLabel();
      if (!file) return;
      const out = $("lab-out");
      out.innerHTML = "";
      $("lab-img").src = URL.createObjectURL(file);
      $("lab-img").hidden = false;
      const state = { label: "busy" };
      show(state);
      const t0 = Date.now();
      try {
        const img = await W.shrinkImage(file);
        const path = `${g.user.id}/test/${Date.now()}.jpg`;
        const up = await W.client.storage.from("labels").upload(path, img, { contentType: img.type || "image/jpeg" });
        if (up.error) throw up.error;
        const label = await W.callFn("bottle-assist", { slug: byob.slug, step: "label", photo_path: path });
        state.label = label.is_wine_label ? "done" : "fail";
        show(state);
        const secs = Math.round((Date.now() - t0) / 1000);
        out.innerHTML = `
          <h2 style="font-size:20px;">What the assistant saw <span class="faint" style="font-size:14px;">(${secs}s)</span></h2>
          <div class="table-wrap"><table class="ledger"><tbody>
            ${[["Wine label?", label.is_wine_label ? "yes" : "no"], ["Producer", label.producer], ["Wine", label.wine],
               ["Vintage", label.vintage], ["Region", label.region], ["Colour", label.colour], ["Unsure about", label.unsure]]
              .map(([k, v]) => `<tr><td style="width:150px;">${k}</td><td>${esc(v || "")}</td></tr>`).join("")}
          </tbody></table></div>
          <div class="market" style="margin-top:14px;">
            <p class="kicker">Background, for the line-up</p>
            <p class="bgtext">${label.background ? esc(label.background) : `<span class="faint">None: not confident enough to write one.</span>`}</p>
          </div>`;
      } catch (err) {
        state.label = "fail";
        show(state, err.message && !err.code ? err.message : W.errorText(err));
      }
    });
  }

  async function loadEvents(selectId) {
    const { data, error } = await W.client.from("events").select("*").order("starts_at", { ascending: false });
    if (error) { page.innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
    events = data;
    if (selectId !== undefined) current = events.find((e) => e.id === selectId) || null;
    else if (current) current = events.find((e) => e.id === current.id) || null;
    render();
  }

  function render() {
    page.innerHTML = `
      <div class="actions" style="justify-content:space-between;">
        <p class="kicker" style="margin:0;">All evenings</p>
        <button class="btn small" type="button" id="new-ev">New evening</button>
      </div>
      <div class="ev-list">${events.map((e) => `
        <button type="button" data-ev="${e.id}" aria-current="${current && current.id === e.id}">
          <span>${esc(e.title)}<br><span class="sub">${esc(W.when(e.starts_at))}${e.venue ? " &middot; " + esc(e.venue) : ""}</span></span>
          <span><span class="pill">${e.format === "byob" ? "BYOB" : "curated"}</span> <span class="pill ${e.status}">${esc(e.status)}</span></span>
        </button>`).join("") || `<p class="muted">No evenings yet.</p>`}
      </div>
      <div id="editor"></div>
      <div id="detail"></div>`;
    $("new-ev").addEventListener("click", () => { current = null; renderEditor(true); $("detail").innerHTML = ""; });
    page.querySelectorAll("[data-ev]").forEach((b) => b.addEventListener("click", () => {
      current = events.find((e) => e.id === b.dataset.ev); render();
    }));
    if (current) { renderEditor(false); renderDetail(); }
  }

        starts_at: fromLocalInput(f.starts_at.value), venue: f.venue.value.trim() || null,

  // ---------- one evening: guests, invitations, bottles, tally ----------
  function renderDetail() {
    const tabs = [["guests", "Guests"], ["invites", "Invitations"], ...(current.format === "byob" ? [["bottles", "Bottles"]] : []), ["tally", "Tally"]];
    if (!tabs.some((t) => t[0] === tab)) tab = "guests";
    $("detail").innerHTML = `
      <div class="tabs" role="tablist">${tabs.map(([k, l]) =>
        `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join("")}</div>
      <div id="tab-body" class="panel"><p class="muted">Loading&hellip;</p></div>`;
    $("detail").querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; renderDetail(); }));
    ({ guests, invites, bottles, tally })[tab]().catch((e) => { $("tab-body").innerHTML = `<p class="msg err">${esc(e.message || W.errorText(e))}</p>`; });
  }

  const ORDER = { reserved: 0, pending: 1, waitlisted: 2, interested: 3, cancelled: 4 };

  async function guests() {
    const { data, error } = await W.client.from("reservations")
      .select("*, profiles(full_name, email, phone)").eq("event_id", current.id);
    if (error) throw error;
    data.sort((a, b) => ORDER[a.status] - ORDER[b.status] || a.created_at.localeCompare(b.created_at));
    const n = (s) => data.filter((r) => r.status === s).length;
    const c = current.currency;
    $("tab-body").innerHTML = `
      <p class="muted">${n("reserved")} of ${current.seats} seats reserved &middot; ${n("pending")} paying now &middot;
        ${n("waitlisted")} waiting &middot; ${n("interested")} interested</p>
      <div class="table-wrap"><table class="ledger">
        <thead><tr><th>Guest</th><th>Status</th><th class="num">Deposit</th><th></th></tr></thead>
        <tbody>${data.map((r) => `
          <tr>
            <td>${esc(r.profiles.full_name)}<small>${esc(r.profiles.email)}${r.profiles.phone ? " &middot; " + esc(r.profiles.phone) : ""}</small></td>
            <td><span class="pill ${r.status}">${r.status}</span>
              <small>${r.status === "reserved" && r.paid_at ? "since " + esc(W.day(r.paid_at)) : ""}
              ${r.status === "cancelled" ? esc(r.refund_status === "refunded" ? `refunded ${W.money(r.refunded_cents, c)}` : r.refund_status || "") : ""}</small></td>
            <td class="num">${r.deposit_paid_cents ? W.money(r.deposit_paid_cents, c) : ""}</td>
            <td class="num">${
              ["interested", "waitlisted"].includes(r.status) ? `<button class="linkish" data-seat="${r.id}">Seat without deposit</button>` :
              ["reserved", "pending"].includes(r.status) ? `<button class="linkish danger" data-cancel="${r.id}">Cancel</button>` : ""}</td>
          </tr>`).join("") || `<tr><td colspan="4" class="muted">No one yet.</td></tr>`}
        </tbody></table></div>
      <p class="msg" data-msg aria-live="polite"></p>`;

    const msg = $("tab-body").querySelector("[data-msg]");
    $("tab-body").querySelectorAll("[data-seat]").forEach((b) => b.addEventListener("click", async () => {
      const { error } = await W.client.from("reservations").update({ status: "reserved", paid_at: new Date().toISOString(),
        hold_expires_at: null }).eq("id", b.dataset.seat);
      if (error) { msg.className = "msg err"; msg.textContent = error.message; return; }
      guests();
    }));
    $("tab-body").querySelectorAll("[data-cancel]").forEach((b) => b.addEventListener("click", async () => {
      const r = data.find((x) => x.id === b.dataset.cancel);
      const inTime = Date.now() <= W.refundCutoff(current).getTime();
      let force = false;
      if (r.deposit_paid_cents && !inTime) {
        force = confirm(`${r.profiles.full_name} is past the refund window. Refund the ${W.money(r.deposit_paid_cents, current.currency)} deposit anyway?\n\nOK = refund, Cancel = keep the deposit.`);
      }
      if (!confirm(`Cancel ${r.profiles.full_name}'s reservation${r.deposit_paid_cents ? (inTime || force ? " and refund the deposit" : ", keeping the deposit") : ""}?`)) return;
      b.disabled = true;
      try {
        await W.callFn("cancel-reservation", { reservation_id: r.id, force_refund: force });
        guests();
      } catch (e) { b.disabled = false; msg.className = "msg err"; msg.textContent = W.errorText(e); }
    }));
  }

  // the message Kai sends; WhatsApp opens with it ready, Kai picks the chat
  function inviteMessage(name) {
    const link = new URL(`reserve.html?event=${encodeURIComponent(current.slug)}`, location.href).href;
    return `${name ? `Hi ${name}! ` : ""}You're invited to ${current.title}, ${W.when(current.starts_at)}` +
      `${current.venue ? ` at ${current.venue}` : ""}.\n\n` +
      `Reserve your seat${current.format === "byob" ? " and add your bottle" : ""} here: ${link}\n` +
      `Sign in with the email address you gave me; you'll get a 6-digit code.`;
  }
  const whatsapp = (text) => `https://wa.me/?text=${encodeURIComponent(text)}`;

  async function invites() {
    const [{ data, error }, { data: res }] = await Promise.all([
      W.client.from("invitations").select("*").eq("event_id", current.id).order("created_at"),
      W.client.from("reservations").select("status, profiles(email)").eq("event_id", current.id).neq("status", "cancelled"),
    ]);
    if (error) throw error;
    const statusOf = (email) => {
      const r = (res || []).find((x) => x.profiles && x.profiles.email === email);
      return r ? r.status : "not yet";
    };
    $("tab-body").innerHTML = `
      <p class="muted">${current.invite_only ? "This evening is by invitation: only these addresses can reserve." :
        "This evening is open to anyone with the link; turn on <em>By invitation only</em> above to limit it to this list."}
        A guest invited by name is not asked for it again.</p>
      <form class="form" id="inv-form">
        <div class="row">
          <label>Name <input name="name" placeholder="Alvin" autocomplete="off"></label>
          <label>Email <input name="email" type="email" required placeholder="alvin@example.com" autocomplete="off"></label>
        </div>
        <div class="actions"><button class="btn small" type="submit">Invite</button>
          <a class="linkish" href="${esc(whatsapp(inviteMessage("")))}" target="_blank" rel="noopener">Share the evening on WhatsApp</a></div>
        <p class="msg" data-msg aria-live="polite"></p>
      </form>
      <div class="table-wrap"><table class="ledger">
        <thead><tr><th>Guest</th><th>Seat</th><th></th></tr></thead>
        <tbody>${data.map((i) => `
        <tr><td>${esc(i.name || "")}<small>${esc(i.email)}</small></td>
          <td><span class="pill ${statusOf(i.email)}">${statusOf(i.email)}</span></td>
          <td class="num"><a class="btn small" href="${esc(whatsapp(inviteMessage(i.name)))}" target="_blank" rel="noopener">WhatsApp</a>
            <button class="linkish danger" data-rm="${esc(i.email)}">Remove</button></td></tr>`).join("") ||
        `<tr><td colspan="3" class="muted">No invitations yet.</td></tr>`}</tbody></table></div>`;
    $("inv-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target;
      const email = f.email.value.trim().toLowerCase();
      const { error: err } = await W.client.from("invitations")
        .upsert({ event_id: current.id, email, name: f.name.value.trim() || null }, { onConflict: "event_id,email" });
      if (err) { const m = f.querySelector("[data-msg]"); m.className = "msg err"; m.textContent = err.message; return; }
      invites();
    });
    $("tab-body").querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", async () => {
      if (!confirm(`Remove the invitation for ${b.dataset.rm}?`)) return;
      await W.client.from("invitations").delete().eq("event_id", current.id).eq("email", b.dataset.rm);
      invites();
    }));
  }

  async function bottles() {
    const { data, error } = await W.client.from("bottles")
      .select("*, profiles(full_name)").eq("event_id", current.id).order("vintage", { nullsFirst: false });
    if (error) throw error;
    const c = current.currency;
    const url = (p) => W.client.storage.from("labels").getPublicUrl(p).data.publicUrl;
    $("tab-body").innerHTML = `
      <div class="table-wrap"><table class="ledger">
        <thead><tr><th>Wine</th><th>Guest</th><th class="num">Shared for</th><th>Status</th><th></th></tr></thead>
        <tbody>${data.map((b) => `
          <tr>
            <td>${b.vintage || "NV"} ${esc(b.producer)} &middot; ${esc(b.wine)}
              <small>${esc(b.region || "")}${b.note ? ` &middot; &ldquo;${esc(b.note)}&rdquo;` : ""}
              ${b.background ? `<br>${esc(b.background)}` : ""}
              ${b.photo_path ? ` &middot; <a href="${esc(url(b.photo_path))}" target="_blank" style="color:var(--gold);">label</a>` : ""}</small></td>
            <td>${esc(b.profiles.full_name)}</td>
            <td class="num">${W.money(b.price_cents, c)}</td>
            <td><span class="pill ${b.status}">${b.status}</span>${b.admin_note ? `<small>${esc(b.admin_note)}</small>` : ""}</td>

              ${b.status !== "declined" ? `<button class="linkish danger" data-set="declined" data-id="${b.id}">Decline</button>` : ""}
            </td>
          </tr>`).join("") || `<tr><td colspan="5" class="muted">No bottles yet.</td></tr>`}
        </tbody></table></div>
      <p class="foot-note">Declined bottles leave the line-up and the tally. Approving is optional: bottles awaiting review still count.</p>`;
    $("tab-body").querySelectorAll("[data-set]").forEach((btn) => btn.addEventListener("click", async () => {
      const upd = { status: btn.dataset.set };
      if (btn.dataset.set === "declined") {
        const why = prompt("A short note for the guest (optional), e.g. off theme:");
        if (why === null) return;
        upd.admin_note = why.trim() || null;
      }
      await W.client.from("bottles").update(upd).eq("id", btn.dataset.id);
      bottles();
    }));
  }

  async function tally() {
    const rows = await W.rpc("event_tally", { p_slug: current.slug });
    const c = current.currency;
    const total = rows.reduce((a, r) => a + r.bottles_cents, 0) + current.shared_costs_cents;
    const owed = rows.filter((r) => r.balance_cents > 0).reduce((a, r) => a + r.balance_cents, 0);
    const back = rows.filter((r) => r.balance_cents < 0).reduce((a, r) => a - r.balance_cents, 0);
    $("tab-body").innerHTML = rows.length ? `
      <p class="muted">Total ${W.money(total, c)}${current.shared_costs_cents ? ` (bottles plus ${W.money(current.shared_costs_cents, c)} shared costs)` : " (bottles only)"},
        split ${rows.length} ways. You collect ${W.money(owed, c)} and pay out ${W.money(back, c)}.</p>
      <div class="table-wrap"><table class="ledger">
        <thead><tr><th>Guest</th><th class="num">Shared</th><th class="num">Deposit</th><th class="num">Share</th>
          <th class="num">Balance</th><th>Settled</th></tr></thead>
        <tbody>${rows.map((r) => `
          <tr><td>${esc(r.guest)}</td><td class="num">${W.money(r.bottles_cents, c)}</td>
            <td class="num">${W.money(r.deposit_cents, c)}</td><td class="num">${W.money(r.share_cents, c)}</td>
            <td class="num">${r.balance_cents > 0 ? `<span class="owes">pays ${W.money(r.balance_cents, c)}</span>`
              : r.balance_cents < 0 ? `<span class="gets">receives ${W.money(-r.balance_cents, c)}</span>` : "square"}</td>
            <td><label class="check"><input type="checkbox" data-settle="${r.reservation_id}" ${r.settled ? "checked" : ""}> settled</label></td>
          </tr>`).join("")}</tbody></table></div>` : `<p class="muted">No seated guests yet.</p>`;
    $("tab-body").querySelectorAll("[data-settle]").forEach((cb) => cb.addEventListener("change", async () => {
      await W.client.from("reservations").update({ settled: cb.checked }).eq("id", cb.dataset.settle);
    }));
  }

  start().catch((e) => { page.innerHTML = `<p class="msg err">${esc(W.errorText(e))}</p>`; });
})();
</script>
</body>
</html>
